name: Build Leve Browser

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'
      - name: Compilar
        run: dotnet build LeveBrowser.csproj -c Release -p:PlatformTarget=${{ matrix.arch }} -o out
      - uses: actions/upload-artifact@v4
        with:
          name: LeveBrowser-${{ matrix.arch }}
          path: out/
